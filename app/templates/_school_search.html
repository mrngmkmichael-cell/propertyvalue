{# A school-name search with a typeahead and a placeholder that types
   out real school names. Included by the admissions index and the
   schools guide; the same ids, so include it once per page. #}
<form class="search-form school-search" action="/schools/admissions/search" method="get" role="search" style="max-width: 36rem; position: relative;" autocomplete="off">
    <label for="sa-q">Find a school by name</label>
    <input id="sa-q" type="text" name="q" placeholder="Type a school name" minlength="2" required
           aria-autocomplete="list" aria-controls="sa-suggest" aria-expanded="false">
    <button type="submit">Search</button>
    <ul class="typeahead" id="sa-suggest" role="listbox" hidden></ul>
</form>
<script>
(function () {
    var input = document.getElementById('sa-q');
    var list = document.getElementById('sa-suggest');
    if (!input || !list) return;

    /* The placeholder types out real school names, one letter at a
       time, so the box shows what to type without a label saying so.
       Stops the moment the reader focuses or types, and never runs for
       anyone who has asked their system for less motion. */
    var examples = ['Harris Academy Orpington', 'Tapton School', 'Ealdham Primary School', 'Mercia School', 'St Mary\'s Church of England Primary'];
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var typing = true, ei = 0, ci = 0, timer = null;
    function tick() {
        if (!typing) return;
        var word = examples[ei];
        if (ci <= word.length) {
            input.setAttribute('placeholder', word.slice(0, ci) + (ci < word.length ? '|' : ''));
            ci += 1;
            timer = setTimeout(tick, 55 + Math.random() * 60);
        } else {
            timer = setTimeout(function () { ci = 0; ei = (ei + 1) % examples.length; tick(); }, 1400);
        }
    }
    function stopTyping() {
        typing = false;
        if (timer) clearTimeout(timer);
        input.setAttribute('placeholder', 'Type a school name');
    }
    if (!reduce) { tick(); } else { input.setAttribute('placeholder', 'e.g. Harris Academy Orpington'); }
    input.addEventListener('focus', stopTyping);
    input.addEventListener('input', stopTyping);

    /* Typeahead: after two characters, ask the site for matching schools
       and list them as links: the school's page where it has one, its
       area on the guide where it does not. */
    var last = '', req = 0;
    function close() { list.hidden = true; list.innerHTML = ''; input.setAttribute('aria-expanded', 'false'); }
    function render(rows) {
        list.innerHTML = '';
        if (!rows.length) { close(); return; }
        rows.forEach(function (r) {
            var li = document.createElement('li');
            li.setAttribute('role', 'option');
            var a = document.createElement('a');
            a.href = r.url;
            a.textContent = r.name;
            var small = document.createElement('span');
            small.className = 'typeahead-sub';
            var sub = (r.authority ? r.authority : '') + (r.phase ? ' \u00b7 ' + r.phase : '');
            if (r.has_page && r.miles) { sub += ' \u00b7 admitted from ' + r.miles + ' mi' + (r.year ? ' (' + r.year + ')' : ''); }
            else { sub += ' \u00b7 no published distance; opens its area'; }
            small.textContent = sub;
            a.appendChild(small);
            li.appendChild(a);
            list.appendChild(li);
        });
        list.hidden = false;
        input.setAttribute('aria-expanded', 'true');
    }
    var debounce = null;
    input.addEventListener('input', function () {
        var q = input.value.trim();
        if (debounce) clearTimeout(debounce);
        if (q.length < 2) { close(); return; }
        debounce = setTimeout(function () {
            if (q === last) return;
            last = q;
            var mine = ++req;
            fetch('/api/school-search?q=' + encodeURIComponent(q), { headers: { 'Accept': 'application/json' } })
                .then(function (r) { return r.json(); })
                .then(function (d) { if (mine === req) render(d.results || []); })
                .catch(close);
        }, 180);
    });
    input.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') close();
        if (e.key === 'ArrowDown' && !list.hidden) { var first = list.querySelector('a'); if (first) { e.preventDefault(); first.focus(); } }
    });
    list.addEventListener('keydown', function (e) {
        var links = Array.prototype.slice.call(list.querySelectorAll('a'));
        var i = links.indexOf(document.activeElement);
        if (e.key === 'ArrowDown' && i < links.length - 1) { e.preventDefault(); links[i + 1].focus(); }
        if (e.key === 'ArrowUp') { e.preventDefault(); if (i > 0) links[i - 1].focus(); else input.focus(); }
        if (e.key === 'Escape') { close(); input.focus(); }
    });
    document.addEventListener('click', function (e) { if (!list.contains(e.target) && e.target !== input) close(); });
})();
</script>
