{% extends "base.html" %}

{% block title %}Sign up — PropertyValue{% endblock %}

{% block content %}
<span class="kicker">Create account</span>
<h1>Sign up</h1>
<p class="dek">Save properties to your watchlist with notes, and check back on them any time.</p>

{% if error %}
    <p class="notice notice-error">{{ error }}</p>
{% endif %}

<form class="stacked-form" action="/signup" method="post">
    <div class="search-form-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">
    </div>
    <div class="search-form-field">
        <label for="password">Password (min. 8 characters)</label>
        <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
    </div>
    <button type="submit">Create account</button>
</form>

<p class="section-sub">Already have an account? <a href="/login">Log in</a></p>
{% endblock %}
