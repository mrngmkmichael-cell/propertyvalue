name: Daily admin summary

on:
  schedule:
    # 07:00 UTC - a morning digest year-round regardless of British
    # Summer Time shifts (07:00 UTC = 8am BST / 7am GMT).
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily summary
        run: |
          curl -sf -X POST "https://ukpropertyinsight.co.uk/internal/send-daily-summary" \
            -H "x-alerts-secret: ${{ secrets.ALERTS_CRON_SECRET }}"
