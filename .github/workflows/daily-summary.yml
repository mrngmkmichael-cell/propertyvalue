name: Daily admin summary

on:
  schedule:
    # 09:00 UTC = 10am UK time while British Summer Time is in effect
    # (roughly late March - late October). GitHub Actions cron is
    # always UTC with no DST awareness, so once clocks go back this
    # will fire at 9am UK time instead of 10am - bump to "0 10 * * *"
    # around then if exact timing matters, or leave it (an hour early
    # in winter is harmless for a morning digest).
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily summary
        run: |
          curl -sf -X POST "https://ukpropertyinsight.co.uk/internal/send-daily-summary" \
            -H "x-alerts-secret: ${{ secrets.ALERTS_CRON_SECRET }}"
