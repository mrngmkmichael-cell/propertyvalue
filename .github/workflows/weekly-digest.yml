name: Weekly watchlist digest

on:
  schedule:
    # 08:00 UTC Monday. An hour after the daily alert job, so anything
    # that changed overnight has already been sent as its own alert and
    # the digest is a round-up rather than a duplicate.
    - cron: "0 8 * * 1"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Send the weekly digest
        run: |
          curl -sf -X POST "https://ukpropertyinsight.co.uk/internal/send-weekly-digest" \
            -H "x-alerts-secret: ${{ secrets.ALERTS_CRON_SECRET }}"
