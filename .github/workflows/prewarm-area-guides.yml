name: Prewarm area guides

on:
  schedule:
    # Four times a day, small batches. 2,943 guides on a 7-day cache
    # means roughly 420 need refreshing a day; 4 x 120 keeps pace while
    # each run stays short enough not to sit on the single worker for
    # long. Batches used to be 250 and measurably slowed live requests.
    #
    # All four runs moved into 11:00-15:00 UTC on 7 Sep 2026. Hourly
    # views over the two days before that peaked at 06:00 (163), 22:00
    # (157), 20:00 (142) and 23:00 (127), and fell to 30, 45, 52, 31 and
    # 24 across 11:00 to 15:00: the audience reads late at night and
    # first thing, and this job used to run at 07:20 and 19:20, inside
    # two of the four peaks. Render gives us one worker and 512 MB, so
    # the batch and the live request compete directly.
    - cron: "20 11,12,13,14 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Warm the next batch
        run: |
          curl -sf --max-time 600 -X POST \
            "https://ukpropertyinsight.co.uk/internal/prewarm-area-guides?limit=120" \
            -H "x-alerts-secret: ${{ secrets.ALERTS_CRON_SECRET }}"
