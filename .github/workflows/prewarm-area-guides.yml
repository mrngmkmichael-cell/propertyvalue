name: Prewarm area guides

on:
  schedule:
    # Four times a day, small batches. 2,943 guides on a 7-day cache
    # means roughly 420 need refreshing a day; 4 x 120 keeps pace while
    # each run stays short enough not to sit on the single worker for
    # long. Batches used to be 250 and measurably slowed live requests.
    - cron: "20 1,7,13,19 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Warm the next batch
        run: |
          curl -sf --max-time 600 -X POST \
            "https://ukpropertyinsight.co.uk/internal/prewarm-area-guides?limit=120" \
            -H "x-alerts-secret: ${{ secrets.ALERTS_CRON_SECRET }}"
